<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Cores da paleta padrão (Esmeralda, src/theme/palettes.ts); o script abaixo e applyTheme as sincronizam com o tema escolhido. -->
    <meta name="theme-color" content="#f8f9ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Money_App — gerenciamento de finanças pessoais" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Money App" />
    <title>Money App</title>
    <script>
      // Aplica modo, paleta e tamanho do texto antes da renderização para evitar flash
      // (mesmas regras de src/theme/theme.ts e cores de src/theme/palettes.ts — DT-019).
      (function () {
        var colors = {
          esmeralda: ['#f8f9ff', '#0b0f17'],
          oceano: ['#f5f9ff', '#09101a'],
          ametista: ['#faf8ff', '#0d0b16'],
          'por-do-sol': ['#fffaf5', '#100d0a'],
          grafite: ['#f7f8fa', '#0d0e10']
        };
        var prefs = {};
        var legacy = null;
        try {
          var raw = localStorage.getItem('money-app:theme:v2');
          if (raw) prefs = JSON.parse(raw) || {};
          legacy = localStorage.getItem('money-app:theme');
        } catch (e) {}
        var mode = prefs.mode;
        if (mode !== 'light' && mode !== 'dark' && mode !== 'system') {
          mode = legacy === 'light' || legacy === 'dark' ? legacy : 'system';
        }
        var palette = Object.prototype.hasOwnProperty.call(colors, prefs.palette) ? prefs.palette : 'esmeralda';
        var textSize = prefs.textSize === 'large' ? 'large' : 'normal';
        var theme = mode;
        if (mode === 'system') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.dataset.palette = palette;
        root.dataset.textSize = textSize;
        root.style.colorScheme = theme;
        var color = colors[palette][theme === 'dark' ? 1 : 0];
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', color);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
